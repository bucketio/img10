<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1325" role="img" aria-labelledby="ngram_window_title ngram_window_desc" font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17384A">
<title id="ngram_window_title">每读到一个 token，以当前及前一个 token 的组合作为查表键</title>
<desc id="ngram_window_desc">n=2 与 token 划分均为教学示意，并非 Qwen4-Max 的公开配置；组合独立查表，省略哈希等实现细节。</desc>
<defs><marker id="ngram_window_arrow_teal" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#087F77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="ngram_window_arrow_orange" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#B76520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="ngram_window_arrow_muted" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#607780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="ngram_window_arrow_blue" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#3366A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
