<text x="32" y="69" font-size="41" font-weight="750" text-anchor="start">窗口滑一步，换一个查表键</text>
<text x="32" y="121" font-size="31" font-weight="400" text-anchor="start" fill="#607780">n = 2：取当前 token 和前一个 token</text>
<line x1="127" y1="187" x2="259" y2="187" stroke="#D9E3E4" stroke-width="3" stroke-linecap="round"/>
<circle cx="102" cy="187" r="25" fill="#EEF1F2"/>
