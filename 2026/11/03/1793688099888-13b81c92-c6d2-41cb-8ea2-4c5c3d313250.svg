<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1390" width="750" height="1390" role="img" aria-labelledby="fa-memory-title fa-memory-desc">
<title id="fa-memory-title">FlashAttention：中间分数在片上算完，不保存完整矩阵</title>
<desc id="fa-memory-desc">上方为普通拆分算子的完整分数矩阵 S 和权重矩阵 P 写回显存的路径。下方用同一个 Q 行块依次处理两个 K/V 块，更新每行统计与输出累积，释放局部分数，再把这个 Q 行块对应的输出写回显存。Q、K、V 和输出仍需占显存。此图是简化过程示意，不代表延迟或所有 FlashAttention 版本的具体循环顺序。</desc>
<defs><marker id="fa-memory-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#178F89" stroke-width="1.8"/></marker></defs>
<g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="750" height="1390" rx="0" fill="#F7F6F1" stroke="none" stroke-width="2" /><text x="36" y="63" font-size="42" fill="#183049" font-weight="700" text-anchor="start" >省掉的，是整张中间矩阵</text><text x="36" y="112" font-size="32" fill="#627383" font-weight="500" text-anchor="start" >所有需要的注意力，仍然照常计算</text><rect x="28" y="147" width="694" height="318" rx="20" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="52" y="196" font-size="34" fill="#183049" font-weight="700" text-anchor="start" >普通拆分算子：先落显存，再读出</text><text x="89" y="300" font-size="33" fill="#183049" font-weight="600" text-anchor="middle" >QKᵀ</text><rect x="175" y="242" width="98" height="98" rx="10" fill="#FFF0DF" stroke="#D87D43" stroke-width="2" /><path d="M 199.5 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 177 266.5 H 271" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 224.0 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 177 291.0 H 271" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 248.5 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 177 315.5 H 271" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="268" width="68" height="47" rx="5" fill="#FFF0DF" stroke="none" stroke-width="2" /><text x="224" y="305" font-size="38" fill="#D87D43" font-weight="700" text-anchor="middle" >S</text><text x="375" y="300" font-size="30" fill="#183049" font-weight="600" text-anchor="middle" >Softmax</text><rect x="477" y="242" width="98" height="98" rx="10" fill="#FFF0DF" stroke="#D87D43" stroke-width="2" /><path d="M 501.5 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 479 266.5 H 573" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 526.0 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 479 291.0 H 573" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 550.5 244 V 338" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 479 315.5 H 573" fill="none" stroke="#D87D43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="268" width="68" height="47" rx="5" fill="#FFF0DF" stroke="none" stroke-width="2" /><text x="526" y="305" font-size="38" fill="#D87D43" font-weight="700" text-anchor="middle" >P</text><text x="658" y="300" font-size="33" fill="#183049" font-weight="600" text-anchor="middle" >× V</text><path d="M 130 291 H 169" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 162 285 L 169 291 L 162 297" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 279 291 H 307" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 285 L 307 291 L 300 297" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 440 291 H 471" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 464 285 L 471 291 L 464 297" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 581 291 H 616" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 609 285 L 616 291 L 609 297" fill="none" stroke="#D87D43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="392" font-size="34" fill="#D87D43" font-weight="600" text-anchor="middle" >S / P：完整 N × N 中间矩阵</text><text x="375" y="437" font-size="28" fill="#627383" font-weight="500" text-anchor="middle" >两者可复用空间，不是必须同时保存</text><rect x="28" y="489" width="694" height="807" rx="20" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="52" y="541" font-size="35" fill="#183049" font-weight="700" text-anchor="start" >FlashAttention：按块在片上处理</text><rect x="52" y="574" width="646" height="151" rx="16" fill="#F0F3F4" stroke="#CCD7D9" stroke-width="2" /><text x="75" y="613" font-size="31" fill="#183049" font-weight="600" text-anchor="start" >显存 HBM：存放 Q、K、V 和输出</text><rect x="76" y="638" width="154" height="59" rx="12" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><text x="153" y="678" font-size="32" fill="#183049" font-weight="600" text-anchor="middle" >Q 行块</text><rect x="250" y="638" width="200" height="59" rx="12" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><text x="350" y="678" font-size="32" fill="#183049" font-weight="600" text-anchor="middle" >K / V 块 1</text><rect x="470" y="638" width="200" height="59" rx="12" fill="#FFFFFF" stroke="#CCD7D9" stroke-width="2" /><text x="570" y="678" font-size="32" fill="#183049" font-weight="600" text-anchor="middle" >K / V 块 2</text><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="250" y="638" width="200" height="59" rx="12" fill="none" stroke="#178F89" stroke-width="4" /></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="470" y="638" width="200" height="59" rx="12" fill="none" stroke="#178F89" stroke-width="4" /></g><text x="80" y="771" font-size="31" fill="#627383" font-weight="500" text-anchor="start" >每次只读入要用的块</text><path d="M 350 705 V 733 H 572" fill="none" stroke="#178F89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 572 705 V 791" fill="none" stroke="#178F89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fa-memory-arrow)"/><g transform="translate(350 705)"><g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 28;222 28;222 72;222 72;222 72" keyTimes="0;0.025;0.07;0.13;0.185;0.22;1" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;1;1;0;0" keyTimes="0;0.025;0.07;0.13;0.185;0.22;1" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="-7" y="-7" width="14" height="14" rx="4" fill="#178F89" stroke="none" stroke-width="2" /></g></g><g transform="translate(572 705)"><g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 72;0 72" keyTimes="0;0.275;0.39;1" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.265;0.275;0.39;0.47;1" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="-7" y="-7" width="14" height="14" rx="4" fill="#178F89" stroke="none" stroke-width="2" /></g></g><rect x="52" y="806" width="646" height="294" rx="16" fill="#E8F4EF" stroke="#178F89" stroke-width="2" /><text x="76" y="851" font-size="32" fill="#178F89" font-weight="700" text-anchor="start" >片上：当前块的共享内存 / 寄存器</text><rect x="76" y="878" width="151" height="73" rx="12" fill="#FFFFFF" stroke="#178F89" stroke-width="2" /><text x="151.5" y="927" font-size="32" fill="#178F89" font-weight="600" text-anchor="middle" >Q 行块</text><path d="M 239 914 H 274" fill="none" stroke="#178F89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fa-memory-arrow)"/><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="287" y="878" width="387" height="73" rx="12" fill="#FFFFFF" stroke="#178F89" stroke-width="2" /><text x="481" y="925" font-size="31" fill="#178F89" font-weight="600" text-anchor="middle" >块 1 → 局部注意力</text><text x="76" y="1006" font-size="32" fill="#183049" font-weight="600" text-anchor="start" >首块结果并入统计与输出累积</text><text x="76" y="1060" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >局部分数用完，即可释放</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="287" y="878" width="387" height="73" rx="12" fill="#FFFFFF" stroke="#178F89" stroke-width="2" /><text x="481" y="925" font-size="31" fill="#178F89" font-weight="600" text-anchor="middle" >块 2 → 局部注意力</text><text x="76" y="1006" font-size="32" fill="#183049" font-weight="600" text-anchor="start" >继续更新统计与输出累积</text><text x="76" y="1060" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >局部分数用完，即可释放</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="287" y="878" width="387" height="73" rx="12" fill="#FFFFFF" stroke="#178F89" stroke-width="2" /><text x="481" y="911" font-size="31" fill="#178F89" font-weight="600" text-anchor="middle" >扫描结束</text><text x="481" y="943" font-size="29" fill="#178F89" font-weight="600" text-anchor="middle" >局部分数已释放</text><text x="76" y="1006" font-size="32" fill="#183049" font-weight="600" text-anchor="start" >每行保留：最大值、分母</text><text x="76" y="1060" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >以及输出累积，见下一张图</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="287" y="878" width="387" height="73" rx="12" fill="#FFFFFF" stroke="#178F89" stroke-width="2" /><text x="481" y="925" font-size="31" fill="#178F89" font-weight="600" text-anchor="middle" >归一化 → 得到 O 块</text><text x="76" y="1006" font-size="32" fill="#183049" font-weight="600" text-anchor="start" >用分母归一化输出累积</text><text x="76" y="1060" font-size="30" fill="#627383" font-weight="500" text-anchor="start" >把这一组 Q 的输出写回显存</text></g><path d="M 375 1106 V 1131" fill="none" stroke="#178F89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fa-memory-arrow)"/><rect x="52" y="1143" width="646" height="70" rx="14" fill="#F0F3F4" stroke="#CCD7D9" stroke-width="2" /><text x="375" y="1189" font-size="32" fill="#183049" font-weight="600" text-anchor="middle" >写回显存：这个 Q 行块的输出 O</text><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><rect x="52" y="1143" width="646" height="70" rx="14" fill="none" stroke="#178F89" stroke-width="4" /></g><text x="51" y="1260" font-size="29" fill="#627383" font-weight="500" text-anchor="start" >① 读块 1</text><g opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><text x="51" y="1260" font-size="29" fill="#178F89" font-weight="700" text-anchor="start" >① 读块 1</text></g><text x="219" y="1260" font-size="29" fill="#627383" font-weight="500" text-anchor="start" >② 换块 2</text><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><text x="219" y="1260" font-size="29" fill="#178F89" font-weight="700" text-anchor="start" >② 换块 2</text></g><text x="387" y="1260" font-size="29" fill="#627383" font-weight="500" text-anchor="start" >③ 留统计</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><text x="387" y="1260" font-size="29" fill="#178F89" font-weight="700" text-anchor="start" >③ 留统计</text></g><text x="555" y="1260" font-size="29" fill="#627383" font-weight="500" text-anchor="start" >④ 写输出</text><g opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/><text x="555" y="1260" font-size="29" fill="#178F89" font-weight="700" text-anchor="start" >④ 写输出</text></g><text x="375" y="1337" font-size="27" fill="#627383" font-weight="500" text-anchor="middle" >过程示意 · 扫完所有 K/V 块后，再处理下一组 Q</text><text x="375" y="1373" font-size="27" fill="#627383" font-weight="500" text-anchor="middle" >省中间矩阵，不代表 Q / K / V 或输出不占显存</text></g></svg>