<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1260" role="img" aria-label="memory_update" font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17384A">
<defs><marker id="memory_update_arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L11 6.5 L2 11" fill="none" stroke="#087F77" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="750" height="1260" rx="0" fill="#F7F9F8"/>
<text x="32" y="68" font-size="43" font-weight="700" text-anchor="start">三句话，记忆怎样更新？</text>
<text x="32" y="121" font-size="30" font-weight="400" text-anchor="start" fill="#59717A">默认偏好与任务例外，分开管理</text>
<rect x="24" y="158" width="702" height="992" rx="24" fill="#FFFFFF" stroke="#D9E3E4" stroke-width="2"/>
<circle cx="91" cy="206" r="21" fill="#EEF1F2"/>
<text x="91" y="264" font-size="29" font-weight="650" text-anchor="middle" fill="#59717A">开始</text>
<circle cx="280" cy="206" r="21" fill="#EEF1F2"/>
<text x="280" y="264" font-size="29" font-weight="650" text-anchor="middle" fill="#59717A">M1</text>
<circle cx="469" cy="206" r="21" fill="#EEF1F2"/>
<text x="469" y="264" font-size="29" font-weight="650" text-anchor="middle" fill="#59717A">M2</text>
<circle cx="658" cy="206" r="21" fill="#EEF1F2"/>
<text x="658" y="264" font-size="29" font-weight="650" text-anchor="middle" fill="#59717A">M3</text>
<line x1="118" y1="206" x2="252" y2="206" stroke="#D9E3E4" stroke-width="3" stroke-linecap="round"/>
<line x1="307" y1="206" x2="441" y2="206" stroke="#D9E3E4" stroke-width="3" stroke-linecap="round"/>
<line x1="496" y1="206" x2="630" y2="206" stroke="#D9E3E4" stroke-width="3" stroke-linecap="round"/>
<rect x="44" y="296" width="662" height="181" rx="20" fill="#EEF1F2"/>
<text x="64" y="527" font-size="33" font-weight="650" text-anchor="start">长期偏好</text>
<rect x="44" y="547" width="662" height="187" rx="20" fill="#E2F3EF"/>
<text x="64" y="788" font-size="33" font-weight="650" text-anchor="start">任务例外</text>
<rect x="44" y="808" width="662" height="185" rx="20" fill="#FFF0DC"/>
<rect x="44" y="1023" width="662" height="101" rx="18" fill="#EEF1F2"/>
<g id="memory_update_state_0" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.125;0.375;0.6875;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="91" cy="206" r="21" fill="#087F77"/>
<text x="64" y="336" font-size="29" font-weight="600" text-anchor="start" fill="#59717A">开始 · 还没有可用记忆</text>
<text x="64" y="394" font-size="38" font-weight="650" text-anchor="start">等待用户表达明确偏好</text>
<text x="64" y="613" font-size="33" font-weight="650" text-anchor="start" fill="#087F77">尚未设置默认字数</text>
<text x="64" y="874" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">尚无任务例外</text>
<text x="375" y="1086" font-size="30" font-weight="600" text-anchor="middle" fill="#17384A">先识别信息，再决定是否保存</text>
</g>
<g id="memory_update_state_1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.125;0.375;0.6875;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="280" cy="206" r="21" fill="#087F77"/>
<text x="64" y="336" font-size="29" font-weight="600" text-anchor="start" fill="#59717A">M1 · 用户明确长期偏好</text>
<text x="64" y="394" font-size="38" font-weight="650" text-anchor="start">以后公众号默认</text>
<text x="64" y="447" font-size="38" font-weight="650" text-anchor="start">2000 字左右。</text>
<text x="64" y="613" font-size="33" font-weight="650" text-anchor="start" fill="#087F77">默认约 2000 字</text>
<text x="64" y="670" font-size="33" font-weight="550" text-anchor="start" fill="#087F77">状态：当前有效</text>
<text x="64" y="874" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">尚无任务例外</text>
<text x="375" y="1086" font-size="30" font-weight="600" text-anchor="middle" fill="#17384A">“以后默认” → 长期用户偏好</text>
</g>
<g id="memory_update_state_2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.125;0.375;0.6875;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="469" cy="206" r="21" fill="#087F77"/>
<text x="64" y="336" font-size="29" font-weight="600" text-anchor="start" fill="#59717A">M2 · 只调整 task-42</text>
<text x="64" y="394" font-size="38" font-weight="650" text-anchor="start">这篇论文解读</text>
<text x="64" y="447" font-size="38" font-weight="650" text-anchor="start">按 4000 字左右写。</text>
<text x="64" y="613" font-size="33" font-weight="650" text-anchor="start" fill="#087F77">默认仍约 2000 字</text>
<text x="64" y="670" font-size="33" font-weight="550" text-anchor="start" fill="#087F77">不被本次例外覆盖</text>
<text x="64" y="874" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">task-42：约 4000 字</text>
<text x="64" y="929" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">仅对当前这篇生效</text>
<text x="375" y="1086" font-size="30" font-weight="600" text-anchor="middle" fill="#17384A">“这篇” → 单独存为任务例外</text>
</g>
<g id="memory_update_state_3" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.125;0.375;0.6875;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="658" cy="206" r="21" fill="#087F77"/>
<text x="64" y="336" font-size="29" font-weight="600" text-anchor="start" fill="#59717A">M3 · task-42 完成后</text>
<text x="64" y="394" font-size="38" font-weight="650" text-anchor="start">以后公众号默认</text>
<text x="64" y="447" font-size="38" font-weight="650" text-anchor="start">改成 1500 字左右。</text>
<text x="64" y="613" font-size="33" font-weight="650" text-anchor="start" fill="#087F77">新默认约 1500 字 · 有效</text>
<text x="64" y="670" font-size="33" font-weight="550" text-anchor="start" fill="#59717A">旧默认 2000 字 → 已替代</text>
<text x="64" y="874" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">task-42：约 4000 字</text>
<text x="64" y="929" font-size="31" font-weight="600" text-anchor="start" fill="#B76520">仅用于本篇 · 任务已完成</text>
<text x="375" y="1086" font-size="30" font-weight="600" text-anchor="middle" fill="#17384A">新任务读取 1500，不再读取旧值</text>
</g>
<line x1="32" y1="1170" x2="718" y2="1170" stroke="#D9E3E4" stroke-width="2" stroke-linecap="round"/>
<text x="32" y="1205" font-size="27" font-weight="400" text-anchor="start" fill="#59717A">教学过程示意；循环时长不表示系统耗时。</text>
</svg>