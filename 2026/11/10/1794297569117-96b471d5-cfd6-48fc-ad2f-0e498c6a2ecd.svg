<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1372" viewBox="0 0 750 1372" role="img" aria-labelledby="batch-title batch-desc">
<title id="batch-title">批处理，怎样复用权重？</title>
<desc id="batch-desc">在同一线性层，单请求只有一份输入 x1，批次中有四份输入 x1 到 x4。同一权重块 W 读入后，在理想的复用情况下可服务更多输入。动画先显示读取权重，再参与运算，最后得到该层输出 h1 或 h1 到 h4。这不表示权重在 HBM 中只读取一次，动画节奏也不是实测耗时。</desc>
